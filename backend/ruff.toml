line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["routes", "database", "worker", "auth", "celery_app", "middleware"]

[lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be used as default
# arguments, so B008 is a false positive for them.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[format]
quote-style = "double"
